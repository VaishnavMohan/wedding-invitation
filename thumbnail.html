<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Thumbnail Preview - Ashin &amp; Vrinda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: radial-gradient(circle at 60% 40%, #173322 0%, #0D1C13 55%, #050B08 100%);
      font-family: 'Montserrat', sans-serif;
      color: #FAF7F2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    /* Ambient Glow */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 600px;
      background: radial-gradient(circle, rgba(229, 197, 120, 0.22) 0%, rgba(30, 62, 43, 0.25) 45%, transparent 70%);
      pointer-events: none;
    }

    /* Card Frame */
    .card-container {
      width: 100%;
      height: 100%;
      border: 2px solid #2B523B;
      border-radius: 28px;
      background: rgba(14, 28, 20, 0.85);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(229, 197, 120, 0.35);
      display: flex;
      align-items: center;
      padding: 36px 44px;
      gap: 44px;
      position: relative;
      overflow: hidden;
    }

    .card-container::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(229, 197, 120, 0.3);
      border-radius: 20px;
      pointer-events: none;
    }

    /* Left Photo Showcase */
    .photo-frame {
      width: 420px;
      height: 470px;
      border-radius: 22px;
      border: 3px solid #E5C578;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(229, 197, 120, 0.3);
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      background: #112018;
    }

    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    /* Right Details Content */
    .details-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .ganesha-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .ganesha-svg {
      width: 28px;
      height: 32px;
    }

    .auspicious-text {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #E5C578;
    }

    .invite-tag {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #A8C2B3;
      margin-bottom: 4px;
    }

    .couple-title {
      font-family: 'Great Vibes', cursive;
      font-size: 76px;
      color: #FFFFFF;
      line-height: 1.05;
      margin: 2px 0 10px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8), 0 0 20px rgba(229, 197, 120, 0.4);
    }

    .date-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 20px;
      background: rgba(229, 197, 120, 0.12);
      border: 1px solid rgba(229, 197, 120, 0.35);
      border-radius: 9999px;
      margin-bottom: 14px;
      width: fit-content;
    }

    .date-text {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #FFF0C2;
      text-transform: uppercase;
    }

    .venue-block {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 23px;
      font-style: italic;
      color: #E8E1D3;
      line-height: 1.35;
    }

    .muhurtham-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #E5C578;
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="card-container">
    
    <!-- Couple Portrait -->
    <div class="photo-frame">
      <img src="assets/images/couple_hero.jpg" alt="Ashin and Vrinda" class="photo-img">
    </div>

    <!-- Wedding Details -->
    <div class="details-content">
      <div class="ganesha-badge">
        <svg class="ganesha-svg" viewBox="0 0 80 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M40 8 C38 12 36 18 36 24 C38 22 42 22 44 24 C44 18 42 12 40 8 Z" fill="#E5C578" />
          <circle cx="40" cy="14" r="2" fill="#E5C578" />
          <path d="M33 22 C37 19 43 19 47 22" stroke="#E5C578" stroke-width="2.2" stroke-linecap="round" />
          <path d="M34 26 C24 24 16 32 18 44 C20 54 28 56 34 50" stroke="#E5C578" stroke-width="2.5" stroke-linecap="round" />
          <path d="M46 26 C56 24 64 32 62 44 C60 54 52 56 46 50" stroke="#E5C578" stroke-width="2.5" stroke-linecap="round" />
          <path d="M40 24 L40 40" stroke="#E5C578" stroke-width="2.5" stroke-linecap="round" />
          <path d="M40 40 C42 48 45 58 40 68 C36 76 26 76 24 68 C22 60 30 58 35 62" stroke="#E5C578" stroke-width="2.8" stroke-linecap="round" />
          <circle cx="35" cy="62" r="3" fill="#E5C578" />
        </svg>
        <span class="auspicious-text">॥ ശ്രീ ഗണേശായ നമഃ ॥</span>
      </div>

      <div class="invite-tag">Wedding Invitation</div>
      <h1 class="couple-title">Ashin &amp; Vrinda</h1>
      
      <div class="date-box">
        <span>📅</span>
        <span class="date-text">Sunday, 06 September 2026</span>
      </div>

      <div class="venue-block">
        Pet Rose Event Centre, Puthencruz
      </div>

      <div class="muhurtham-tag">
        <span>⏰</span>
        <span>Muhurtham: 11:59 AM – 12:20 PM</span>
        <span>•</span>
        <span>Lunch Thereafter</span>
      </div>
    </div>

  </div>
</body>
</html>
