<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Square Thumbnail - Ashin &amp; Vrinda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@1,600&family=Great+Vibes&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #1A3827 0%, #0F2016 65%, #050B08 100%);
      font-family: 'Montserrat', sans-serif;
      color: #FAF7F2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      text-align: center;
    }

    .card-border {
      position: absolute;
      inset: 12px;
      border: 2px solid #2B523B;
      border-radius: 24px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(229, 197, 120, 0.35);
      pointer-events: none;
    }

    .card-border::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px dashed rgba(229, 197, 120, 0.3);
      border-radius: 18px;
    }

    .photo-circle-wrap {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 3.5px solid #E5C578;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(229, 197, 120, 0.35);
      overflow: hidden;
      margin-bottom: 14px;
      background: #112018;
      position: relative;
      z-index: 2;
    }

    .photo-circle-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    .ganesha-mini {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      z-index: 2;
    }

    .ganesha-svg {
      width: 20px;
      height: 22px;
    }

    .auspicious-text {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #E5C578;
    }

    .couple-title {
      font-family: 'Great Vibes', cursive;
      font-size: 58px;
      color: #FFFFFF;
      line-height: 1.05;
      margin: 2px 0 6px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8), 0 0 16px rgba(229, 197, 120, 0.4);
      z-index: 2;
    }

    .date-pill {
      display: inline-block;
      padding: 5px 16px;
      background: rgba(229, 197, 120, 0.12);
      border: 1px solid rgba(229, 197, 120, 0.4);
      border-radius: 9999px;
      font-family: 'Cinzel', serif;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #FFF0C2;
      text-transform: uppercase;
      margin-bottom: 6px;
      z-index: 2;
    }

    .venue-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-style: italic;
      color: #E8E1D3;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="card-border"></div>

  <!-- Couple Circle Photo -->
  <div class="photo-circle-wrap">
    <img src="assets/images/couple_hero.jpg" alt="Ashin &amp; Vrinda" class="photo-circle-img">
  </div>

  <div class="ganesha-mini">
    <svg class="ganesha-svg" viewBox="0 0 80 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M40 8 C38 12 36 18 36 24 C38 22 42 22 44 24 C44 18 42 12 40 8 Z" fill="#E5C578" />
      <circle cx="40" cy="14" r="2" fill="#E5C578" />
      <path d="M33 22 C37 19 43 19 47 22" stroke="#E5C578" stroke-width="2.2" stroke-linecap="round" />
      <path d="M34 26 C24 24 16 32 18 44 C20 54 28 56 34 50" stroke="#E5C578" stroke-width="2.5" stroke-linecap="round" />
      <path d="M46 26 C56 24 64 32 62 44 C60 54 52 56 46 50" stroke="#E5C578" stroke-width="2.5" stroke-linecap="round" />
      <path d="M40 24 L40 40" stroke="#E5C578" stroke-width="2.5" stroke-linecap="round" />
      <path d="M40 40 C42 48 45 58 40 68 C36 76 26 76 24 68 C22 60 30 58 35 62" stroke="#E5C578" stroke-width="2.8" stroke-linecap="round" />
      <circle cx="35" cy="62" r="3" fill="#E5C578" />
    </svg>
    <span class="auspicious-text">॥ ശ്രീ ഗണേശായ നമഃ ॥</span>
  </div>

  <h1 class="couple-title">Ashin &amp; Vrinda</h1>
  <div class="date-pill">Sunday, 06 September 2026</div>
  <div class="venue-text">Pet Rose Event Centre, Puthencruz</div>
</body>
</html>
